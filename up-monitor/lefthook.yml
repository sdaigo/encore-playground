pre-commit:
  commands:
    check:
        glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
        run: biome check --write --no-errors-on-unmatched {staged_files}
        stage_fixed: true
pre-push:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: biome check --no-errors-on-unmatched {push_files}