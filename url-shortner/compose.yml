services:
  postgres:
    image: postgres:15
    container_name: url-shortner-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - url-shortner-network
  url-shortner-service:
    image: url-shortner:v1.5
    container_name: url-shortner-service
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - url-shortner-network

networks:
  url-shortner-network:
    driver: bridge

volumes:
  postgres-data: